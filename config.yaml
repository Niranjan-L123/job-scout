# job-scout configuration
# Keywords are matched case-insensitively on word boundaries.

state_path: data/seen.json

filters:
  # The job title must contain at least one of these (internship / 12-month placement).
  role_keywords:
    - intern
    - interns
    - internship
    - internships
    - placement
    - placements
    - "industrial placement"
    - "year in industry"
    - "year-in-industry"
    - "sandwich year"
    - "sandwich placement"
    - "12 month"
    - "12-month"
    - "twelve month"
    - co-op
    - "undergraduate scheme"

  # Reject if the title contains any of these.
  exclude_keywords:
    - senior
    - staff
    - principal
    - director
    - "head of"
    - manager
    - phd
    - postdoc
    - "outplacement"

  # Reject self-funded IT training-course adverts masquerading as jobs (matched
  # against title + company + department). These are course sellers, not
  # employers — the user has zero interest in them.
  spam_keywords:
    # Paid-training / scam tells
    - "self-funded"
    - "self funded"
    - "self-employed"
    - "training programme"
    - "training program"
    - "training course"
    - "traineeship"
    - "trainee programme"
    - "trainee program"
    - "study programme"
    - "no experience required"
    - "no experience needed"
    - "no experience necessary"
    - "guaranteed interview"
    - "guaranteed job"
    - "guaranteed placement"
    - "job guarantee"
    - "money back"
    - "money-back"
    - "course fee"
    - "tuition"
    - "enrol"
    - "enroll"
    - "enrolment"
    - "bootcamp"
    - "boot camp"
    - "career change"
    - "change your career"
    - "kickstart your career"
    - "re-train"
    - "retrain"
    - "get into tech"
    - "get into it"
    - "fast track into"
    # Known course-seller companies (aggregated in via Adzuna/Reed/CV-Library)
    - "itonlinelearning"
    - "it online learning"
    - "nuyew"
    - "e-careers"
    - "ecareers"
    - "just it"
    - "learning people"
    - "career academy"
    - "tech academy"
    - "training academy"
    - "skills group"
    - "knowledgehut"
    - "baltic apprenticeships"

  # Title or department must contain at least one of these (set require_tech: false to disable).
  require_tech: true
  tech_keywords:
    - software
    - engineer
    - engineering
    - developer
    - development
    - security
    - cyber
    - cybersecurity
    - data
    - devops
    - sre
    - cloud
    - infrastructure
    - platform
    - network
    - networking
    - "machine learning"
    - ai
    - ml
    - research
    - technology
    - tech
    - computer
    - computing
    - "full stack"
    - frontend
    - "front end"
    - backend
    - "back end"
    - mobile
    - qa
    - test
    - analyst
    - product
    - solutions
    - systems
    - electronics
    - embedded
    - firmware
    - robotics
    - hardware
    - digital
    - informatics

  # Any of these marks the job as PRIORITY (security) in the Discord alert.
  security_keywords:
    - security
    - cyber
    - cybersecurity
    - infosec
    - "information security"
    - soc
    - siem
    - penetration
    - pentest
    - "pen test"
    - "red team"
    - "blue team"
    - "purple team"
    - threat
    - vulnerability
    - appsec
    - "application security"
    - "product security"
    - "cloud security"
    - "network security"
    - grc
    - cryptography
    - forensics
    - malware
    - detection
    - "incident response"
    - "offensive security"

  # US/international trackers: require a positive UK location match (don't let
  # blank-location postings through). These repos are US-dominated.
  strict_location_sources:
    - simplify
    - speedyapply

  # Hard non-UK signals — reject unless an unambiguous UK marker (UK/England/...)
  # is also present (so "London, UK, SF, NYC" still passes). US state codes like
  # ", MA"/", NY" are handled separately in code. Collision cities (Cambridge,
  # York, Lincoln, Plymouth, Surrey) are disambiguated by those state codes, so
  # they are NOT listed here.
  exclude_location_terms:
    - "united states"
    - usa
    - "u.s.a"
    - america
