sources:
  # ---- Direct ATS APIs (most reliable; jobs appear here before LinkedIn) ----
  # Add/remove company slugs freely, then run `python -m scraper.validate`
  # (or the Actions "validate" dispatch) to confirm each slug works.

  greenhouse:
    enabled: true
    companies:
      - cloudflare
      - monzo
      - skyscanner
      - databricks
      - wayve
      - graphcore
      - netcraft
      - stripe
      - datadog
      - mongodb
      - twilio
      - elastic
      - ocadogroup

  lever:
    enabled: true
    companies:
      - palantir
      - sophos
      - octoenergy

  ashby:
    enabled: true
    companies:
      - elevenlabs
      - quantexa
      - immersivelabs
      - thought-machine
      - improbable
      - deliveroo
      - trainline
      - synthesia

  workable:
    enabled: true
    companies:
      - huggingface
      - senseon
      - portswigger
      - bridewell

  workday:
    enabled: true
    boards:
      # host / tenant / site as they appear in the careers URL:
      # https://<tenant>.wdN.myworkdayjobs.com/<site>
      - host: rollsroyce.wd3.myworkdayjobs.com
        tenant: rollsroyce
        site: professional
        search: "placement"
      - host: nccgroup.wd3.myworkdayjobs.com
        tenant: nccgroup
        site: NCC_Group
        search: ""
      - host: kainos.wd3.myworkdayjobs.com
        tenant: kainos
        site: Kainos
        search: ""
      - host: astrazeneca.wd3.myworkdayjobs.com
        tenant: astrazeneca
        site: Careers
        search: "placement"

  # ---- GitHub internship tracker repos ----
  simplify:
    enabled: true
    listing_urls:
      - https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/.github/scripts/listings.json

  # International (incl. UK) SWE internships tracked by speedyapply.
  speedyapply:
    enabled: true
    listing_urls:
      - https://raw.githubusercontent.com/speedyapply/2026-SWE-College-Jobs/main/INTERN_INTL.md

  # ---- UK job aggregator API (free key from https://developer.adzuna.com) ----
  # Covers Reed, Totaljobs, CV-Library and many portals in one API.
  # Enabled automatically when ADZUNA_APP_ID / ADZUNA_APP_KEY env vars are set.
  adzuna:
    enabled: true
    max_days_old: 3
    queries:
      - "cyber security placement"
      - "security intern"
      # Targeted cyber recall (titles still must contain a role keyword to pass)
      - "SOC analyst placement"
      - "penetration testing placement"
      - "security analyst placement"
      - "information security internship"
      - "cyber security industrial placement"
      - "cyber security year in industry"
      - "software placement year"
      - "industrial placement software"
      - "technology internship"
      - "12 month placement IT"
      # Broad sweep: any IT-category job whose ad mentions intern/placement.
      - what_or: "intern internship placement undergraduate"
        category: it-jobs

  # ---- Reed.co.uk API (major UK board; free key: reed.co.uk/developers) ----
  # Dormant until REED_API_KEY is set as an env var / GitHub Actions secret.
  reed:
    enabled: true
    max_days_old: 7
    results_per_query: 100
    location: "United Kingdom"
    queries:
      - "cyber security placement"
      - "cyber security internship"
      - "security analyst placement"
      - "SOC analyst placement"
      - "penetration testing placement"
      - "information security internship"
      - "software engineering placement"
      - "software developer internship"
      - "data science placement"
      - "IT industrial placement"

  # ---- UK placement boards (best-effort HTML scraping; may be bot-blocked) ----
  gradcracker:
    enabled: true
    # Discipline-specific placement feeds — cyber-security first (the user's
    # priority), then the rest of computing/tech.
    search_urls:
      - https://www.gradcracker.com/search/computing-technology/cyber-security-work-placements-internships
      - https://www.gradcracker.com/search/computing-technology/computer-science-work-placements-internships
      - https://www.gradcracker.com/search/computing-technology/information-technology-work-placements-internships
      - https://www.gradcracker.com/search/computing-technology/software-systems-work-placements-internships
      - https://www.gradcracker.com/search/computing-technology/data-science-work-placements-internships
      - https://www.gradcracker.com/search/computing-technology/ai-machine-learning-work-placements-internships
      - https://www.gradcracker.com/search/computing-technology/engineering-work-placements-internships

  # Disabled: ratemyplacement.co.uk renders job listings client-side with
  # JavaScript, so plain HTML scraping returns nothing. Gradcracker + Adzuna
  # cover the same UK placement market.
  ratemyplacement:
    enabled: false
    search_urls:
      - "https://www.ratemyplacement.co.uk/search-jobs?show=jobs&industry=it-technology"
